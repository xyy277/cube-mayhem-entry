<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方块星人暴走 / CUBE MAYHEM — 入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cube Mayhem">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0A0A12; --bg-soft:#0E0E1A; --bg-soft2:#1C0F33;
  --cyan:#00E5FF; --magenta:#FF2D9B; --green:#39FF14; --yellow:#FFE600;
  --text:#F5F7FF; --text-2:#9AA0C4; --text-dim:#6B7194;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh; background:var(--bg); color:var(--text);
  font-family:"Noto Sans SC",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; padding:24px;
  background-image:
    radial-gradient(620px circle at 18% 22%, rgba(0,229,255,.12), transparent 70%),
    radial-gradient(620px circle at 88% 30%, rgba(255,45,155,.12), transparent 70%),
    linear-gradient(rgba(0,229,255,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,.06) 1px, transparent 1px);
  background-size:auto,auto,42px 42px,42px 42px; position:relative;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);opacity:.35}
.entry{position:relative;z-index:2;width:100%;max-width:680px;
  background:linear-gradient(90deg,var(--bg-soft),var(--bg-soft2));
  border:1.5px solid rgba(0,229,255,.5); border-radius:12px;
  box-shadow:8px 8px 0 rgba(255,45,155,.8); padding:56px 48px; text-align:center}
.brand{font-weight:900;font-size:20px;color:var(--cyan);letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:10px}
.brand-icon{width:22px;height:22px;background:var(--magenta);border:2px solid var(--cyan);border-radius:4px;display:inline-block}
.eyebrow{font-family:"Montserrat",sans-serif;font-weight:900;font-size:13px;letter-spacing:2px;
  color:var(--cyan);text-transform:uppercase;margin-top:22px}
h1{font-weight:900;font-size:44px;line-height:52px;margin-top:12px;
  text-shadow:0 0 16px rgba(0,229,255,.45)}
.sub{font-size:16px;color:var(--text-2);line-height:26px;margin-top:16px}
.cta{display:flex;gap:16px;margin-top:36px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:700;font-size:17px;text-decoration:none;padding:16px 30px;border-radius:6px;transition:transform .12s;cursor:pointer}
.btn-primary{background:var(--magenta);color:var(--bg);box-shadow:4px 4px 0 var(--cyan)}
.btn-primary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--cyan)}
.btn-secondary{background:transparent;color:var(--cyan);border:1.5px solid var(--cyan)}
.btn-secondary:hover{background:rgba(0,229,255,.08)}
.btn-star{background:transparent;color:var(--yellow);border:1.5px solid var(--yellow)}
.btn-star:hover{background:rgba(255,230,0,.1)}
.star{margin-top:18px}
.install{margin-top:16px}
.btn-install{display:none;background:var(--green);color:var(--bg);font-weight:700;font-size:15px;
  padding:12px 24px;border-radius:6px;border:0;cursor:pointer;box-shadow:4px 4px 0 var(--cyan)}
.btn-install:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--cyan)}
@media (max-width:560px){.btn-install{display:inline-block !important}}
.hint{margin-top:22px;text-align:left;background:rgba(0,0,0,.28);border:1px solid rgba(0,229,255,.25);
  border-radius:8px;padding:16px 18px}
.hint-title{font-size:13px;font-weight:700;color:var(--cyan);letter-spacing:.5px;margin-bottom:12px;
  display:flex;align-items:center;gap:6px}
.hint-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-2);line-height:21px;margin-top:9px}
.hint-row:first-of-type{margin-top:0}
.hint-ico{flex:0 0 auto;font-size:15px;line-height:21px}
.hint b{color:var(--text);font-weight:700}
.hint kbd{background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.4);border-radius:4px;
  padding:1px 6px;font-family:inherit;font-size:12px;color:var(--cyan)}
.note{font-size:13px;color:var(--text-dim);margin-top:28px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:linear-gradient(90deg,var(--bg-soft),var(--bg-soft2));border:1.5px solid rgba(0,229,255,.6);border-radius:12px;box-shadow:8px 8px 0 rgba(255,45,155,.8);max-width:420px;width:100%;padding:26px 22px;color:var(--text)}
.modal h3{font-weight:900;font-size:19px;color:var(--cyan);margin-bottom:12px}
.modal .step{margin-top:10px;background:rgba(0,0,0,.32);border:1px solid rgba(0,229,255,.25);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--text);line-height:21px}
.modal .step b{color:var(--cyan)}
.modal .url-box{margin-top:10px;padding:8px 10px;background:rgba(0,0,0,.5);border:1px dashed rgba(0,229,255,.3);border-radius:6px;font-family:ui-monospace,monospace;font-size:11px;color:var(--cyan);word-break:break-all;user-select:all}
.modal .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.modal .btn-copy,.modal .btn-close{font-weight:700;font-size:14px;padding:10px 18px;border-radius:6px;border:0;cursor:pointer}
.modal .btn-copy{background:var(--cyan);color:var(--bg)}
.modal .btn-close{background:transparent;color:var(--text-2);border:1px solid rgba(255,255,255,.2)}
@media (max-width:560px){
  .entry{padding:40px 24px}
  h1{font-size:32px;line-height:40px}
  .cta{flex-direction:column}
  .btn{width:100%}
}
</style></head>
<body>
  <div class="entry">
    <div class="brand"><span class="brand-icon"></span>方块星人暴走</div>
    <div class="eyebrow">CUBE MAYHEM // ENTRY</div>
    <h1>欢迎来到方块星海</h1>
    <p class="sub">浏览器即开即玩的体素科幻 FPS。访问地址会随隧道续期自动更新，你只需选个入口。</p>
    <div class="cta">
      <a class="btn btn-secondary" href="#" onclick="go('/index.html');return false;">📖 游戏介绍</a>
      <a class="btn btn-primary" href="#" onclick="go('/lobby.html');return false;">▶ 进入游戏</a>
    </div>
    <div class="star">
      <a class="btn btn-star" href="https://github.com/xyy277/fps-world" target="_blank" rel="noopener noreferrer" title="在新窗口打开 GitHub，不会离开本页面">★ 给项目点个 Star ↗</a>
    </div>
    <div class="install">
      <button class="btn-install" id="installBtn">＋ 安装到桌面 / 主屏幕</button>
    </div>
    <div class="hint">
      <div class="hint-title">📌 收藏一下，下次秒进</div>
      <div class="hint-row"><span class="hint-ico">💻</span><span><b>电脑：</b>按 <kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>D</kbd> 收藏本页；支持安装的浏览器点上方「安装到桌面」</span></div>
      <div class="hint-row"><span class="hint-ico">📱</span><span><b>iPhone / iPad：</b>点底部 分享 图标 → 「添加到主屏幕」</span></div>
      <div class="hint-row"><span class="hint-ico">🤖</span><span><b>Android：</b>点 ⋮ 菜单 → 「安装应用」/「添加到主屏幕」</span></div>
    </div>
    <p class="note" id="note">正在检测游戏服务…</p>
  </div>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modalTitle">📲 添加到主屏幕</h3>
      <div id="modalBody"></div>
      <div class="actions">
        <button class="btn-copy" id="copyUrl">复制链接</button>
        <button class="btn-close" id="closeModal">关闭</button>
      </div>
    </div>
  </div>
<script>
var GAME = { play:'/lobby.html', intro:'/index.html' };
var GAME_URL = '';
async function load(){
  try{
    var r = await fetch('game_url.json?t=' + Date.now());
    var j = await r.json();
    GAME_URL = (j && j.url) ? j.url : '';
  }catch(e){ GAME_URL = ''; }
  var note = document.getElementById('note');
  note.innerHTML = GAME_URL
    ? '当前游戏服务：<b>在线</b> · 跳转目标每 ~30h 自动刷新'
    : '当前游戏服务：<b>暂未上线</b> · 请稍后再试';
}
function go(path){
  if(!GAME_URL){ alert('游戏服务暂未上线，请稍后再试'); return; }
  var u = new URL(GAME_URL); u.pathname = path; location.href = u.toString();
}

var installBtn = document.getElementById('installBtn');
var modal = document.getElementById('modal');
var modalTitle = document.getElementById('modalTitle');
var modalBody = document.getElementById('modalBody');
var closeModalBtn = document.getElementById('closeModal');
var copyUrlBtn = document.getElementById('copyUrl');
var deferredPrompt = null;
var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
var isAndroid = /Android/i.test(navigator.userAgent);
var isMobile = isIOS || isAndroid;

function showInstallModal(){
  if(isIOS){
    modalTitle.textContent = '📲 iPhone / iPad 添加到主屏幕';
    modalBody.innerHTML =
      '<div class="step"><b>1.</b> 点底部中间的 <b>分享</b> 图标（方框带 ↑）</div>' +
      '<div class="step"><b>2.</b> 菜单里选 <b>「添加到主屏幕」</b></div>' +
      '<div class="step"><b>3.</b> 点右上角 <b>「添加」</b> 完成</div>' +
      '<div class="url-box">' + location.href + '</div>';
  } else if(isAndroid){
    modalTitle.textContent = '📲 Android 添加到主屏幕';
    modalBody.innerHTML =
      '<div class="step"><b>方法一：</b>点右上角 <b>⋮</b> 菜单 → 选 <b>「安装应用」</b> 或 <b>「添加到主屏幕」</b></div>' +
      '<div class="step"><b>方法二：</b>地址栏右侧出现 <b>「安装」</b> 图标时点一下</div>' +
      '<div class="url-box">' + location.href + '</div>';
  } else {
    modalTitle.textContent = '⭐ 收藏本页';
    modalBody.innerHTML =
      '<div class="step">按 <kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>D</kbd> 即可收藏</div>' +
      '<div class="url-box">' + location.href + '</div>';
  }
  modal.classList.add('show');
}
closeModalBtn.addEventListener('click', function(){ modal.classList.remove('show'); });
modal.addEventListener('click', function(e){ if(e.target === modal) modal.classList.remove('show'); });
copyUrlBtn.addEventListener('click', function(){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(location.href).then(function(){
      copyUrlBtn.textContent = '✓ 已复制';
      setTimeout(function(){ copyUrlBtn.textContent = '复制链接'; }, 1500);
    }).catch(function(){ copyUrlBtn.textContent = '请长按链接复制'; });
  } else { copyUrlBtn.textContent = '请长按链接复制'; }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
if(isMobile){
  installBtn.textContent = '📲 添加到主屏幕';
  installBtn.style.display = 'inline-block';
}
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'inline-block';
});
installBtn.addEventListener('click', function(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt = null; });
  } else { showInstallModal(); }
});
window.addEventListener('appinstalled', function(){ if(installBtn && !isMobile) installBtn.style.display = 'none'; });

load();
</script>
</body></html>
